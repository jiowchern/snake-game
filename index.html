<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>貪吃蛇</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --line: #21262d;
    --text: #e6edf3;
    --dim: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #f2cc60;
    --blue: #58a6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: 4px; margin-bottom: 10px; color: var(--dim); }
  #hud {
    display: flex;
    gap: 24px;
    margin-bottom: 10px;
    font-size: 14px;
    color: var(--dim);
  }
  #hud b { color: var(--text); font-variant-numeric: tabular-nums; }
  #wrap { position: relative; width: min(674px, 94vw, calc(100vh - 140px)); }
  canvas {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    display: block;
    width: 100%;
    height: auto;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(13, 17, 23, 0.82);
    border-radius: 6px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: 26px; font-weight: 700; }
  .overlay .sub { font-size: 15px; color: var(--dim); }
  #legend {
    display: flex;
    gap: 18px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--dim);
  }
  #legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<h1>貪吃蛇</h1>
<div id="hud">
  <span>分數 <b id="score">0</b></span>
  <span>最高分 <b id="best">0</b></span>
  <span>長度 <b id="len">1</b></span>
  <span>速度 <b id="spd">1.00x</b></span>
</div>
<div id="wrap">
  <canvas id="game" width="672" height="672"></canvas>
  <div id="startOverlay" class="overlay">
    <div class="big">按方向鍵開始</div>
    <div class="sub">方向鍵 / WASD 移動</div>
  </div>
  <div id="deadOverlay" class="overlay hidden">
    <div class="big">遊戲結束</div>
    <div class="sub" id="deadStats"></div>
    <div class="sub">按 Enter 重新開始</div>
  </div>
</div>
<div id="legend">
  <span><i class="dot" style="background:var(--green)"></i>加長</span>
  <span><i class="dot" style="background:var(--red)"></i>減短</span>
  <span><i class="dot" style="background:var(--yellow)"></i>加速</span>
  <span><i class="dot" style="background:var(--blue)"></i>減速</span>
</div>

<script>
(() => {
  const GRID = 28;
  const CELL = 24;
  const BASE_INTERVAL = 140; // ms per step at 1.00x
  const MAX_STEPS_PER_FRAME = 30;

  const EGG_TYPES = [
    { key: "grow",   color: "#3fb950", weight: 55 },
    { key: "shrink", color: "#f85149", weight: 15 },
    { key: "fast",   color: "#f2cc60", weight: 15 },
    { key: "slow",   color: "#58a6ff", weight: 15 },
  ];

  const KEY_DIRS = {
    ArrowUp: { x: 0, y: -1 },  KeyW: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 },
  };

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const el = {
    score: document.getElementById("score"),
    best: document.getElementById("best"),
    len: document.getElementById("len"),
    spd: document.getElementById("spd"),
    start: document.getElementById("startOverlay"),
    dead: document.getElementById("deadOverlay"),
    deadStats: document.getElementById("deadStats"),
  };

  // ==== 狀態機核心:Change 只做交接(舊 Disable → 新 Enable) ====
  const EMPTY_STATE = { Enable() {}, Disable() {}, Update() {} };

  class StateMachine {
    constructor() { this._current = EMPTY_STATE; }
    Change(next) {
      this._current.Disable();
      this._current = next;
      this._current.Enable();
    }
    Update(dt) { this._current.Update(dt); }
    Empty() { this.Change(EMPTY_STATE); }
  }

  // ==== 無狀態工具 ====
  function randomEggType() {
    let r = Math.random() * 100;
    for (const t of EGG_TYPES) {
      if (r < t.weight) return t;
      r -= t.weight;
    }
    return EGG_TYPES[0];
  }

  function spawnEggs(snake, eggs) {
    const target = 1 + Math.floor(Math.random() * 3); // 1~3 顆
    const occupied = new Set(snake.map(s => s.x + "," + s.y));
    for (const e of eggs) occupied.add(e.x + "," + e.y);
    while (eggs.length < target) {
      const free = [];
      for (let y = 0; y < GRID; y++)
        for (let x = 0; x < GRID; x++)
          if (!occupied.has(x + "," + y)) free.push({ x, y });
      if (!free.length) return;
      const cell = free[Math.floor(Math.random() * free.length)];
      occupied.add(cell.x + "," + cell.y);
      eggs.push({ x: cell.x, y: cell.y, type: randomEggType() });
    }
  }

  function createBoard() {
    const c = Math.floor(GRID / 2);
    const snake = [{ x: c, y: c }];
    const eggs = [];
    spawnEggs(snake, eggs);
    return { snake, eggs };
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function drawBoard(snake, eggs) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(255,255,255,0.03)";
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    for (const e of eggs) {
      ctx.fillStyle = e.type.color;
      ctx.beginPath();
      ctx.arc(e.x * CELL + CELL / 2, e.y * CELL + CELL / 2, CELL * 0.32, 0, Math.PI * 2);
      ctx.fill();
    }

    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      ctx.fillStyle = i === 0 ? "#ffffff" : "#7ee787";
      const pad = i === 0 ? 2 : 3;
      roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
    }
  }

  // ==== 狀態:等待開始 ====
  class ReadyState {
    constructor(snake, eggs) {
      this.StartEvent = null; // (dir) => void
      this._snake = snake;
      this._eggs = eggs;
      this._pendingDir = null;
      this._onKey = (ev) => {
        const d = KEY_DIRS[ev.code];
        if (!d) return;
        ev.preventDefault();
        // 輸入回呼只寫資料,事件一律由 Update 發出
        if (!this._pendingDir) this._pendingDir = d;
      };
    }
    Enable() {
      el.start.classList.remove("hidden");
      document.addEventListener("keydown", this._onKey);
    }
    Disable() {
      document.removeEventListener("keydown", this._onKey);
      el.start.classList.add("hidden");
    }
    Update() {
      if (this._pendingDir) return this.StartEvent(this._pendingDir);
      drawBoard(this._snake, this._eggs);
    }
  }

  // ==== 狀態:遊戲進行中 ====
  class RunningState {
    constructor(snake, eggs, dir) {
      this.DiedEvent = null; // (score, snake, eggs) => void
      this.HudEvent = null;  // (score, len, speed) => void
      this._snake = snake;
      this._eggs = eggs;
      this._dir = dir;
      this._dirQueue = [];
      this._growPending = 0;
      this._score = 0;
      this._speed = 1;
      this._acc = 0;
      this._dead = false;
      this._hudDirty = true;
      this._onKey = (ev) => {
        const d = KEY_DIRS[ev.code];
        if (!d) return;
        ev.preventDefault();
        if (this._dirQueue.length < 3) this._dirQueue.push(d);
      };
    }
    Enable() { document.addEventListener("keydown", this._onKey); }
    Disable() { document.removeEventListener("keydown", this._onKey); }
    Update(dt) {
      this._acc += dt;
      const interval = BASE_INTERVAL / this._speed;
      let steps = 0;
      while (this._acc >= interval && steps < MAX_STEPS_PER_FRAME && !this._dead) {
        this._acc -= interval;
        this._step();
        steps++;
      }
      if (steps === MAX_STEPS_PER_FRAME) this._acc = 0;
      drawBoard(this._snake, this._eggs);
      if (this._hudDirty) {
        this._hudDirty = false;
        this.HudEvent(this._score, this._snake.length, this._speed);
      }
      if (this._dead) this.DiedEvent(this._score, this._snake, this._eggs);
    }
    _step() {
      const snake = this._snake;
      // 從緩衝取出下一個有效方向(長度 >= 2 禁止 180 度回頭)
      while (this._dirQueue.length) {
        const d = this._dirQueue.shift();
        if (snake.length >= 2 && d.x === -this._dir.x && d.y === -this._dir.y) continue;
        if (d.x === this._dir.x && d.y === this._dir.y) continue;
        this._dir = d;
        break;
      }

      const head = { x: snake[0].x + this._dir.x, y: snake[0].y + this._dir.y };
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        this._dead = true;
        return;
      }

      // 撞自己:尾巴這一步若會移走,不算碰撞
      const tailMoves = this._growPending === 0;
      const checkLen = tailMoves ? snake.length - 1 : snake.length;
      for (let i = 0; i < checkLen; i++)
        if (snake[i].x === head.x && snake[i].y === head.y) {
          this._dead = true;
          return;
        }

      snake.unshift(head);
      if (this._growPending > 0) this._growPending--;
      else snake.pop();

      const eggIdx = this._eggs.findIndex(e => e.x === head.x && e.y === head.y);
      if (eggIdx !== -1) {
        const type = this._eggs[eggIdx].type.key;
        this._eggs.splice(eggIdx, 1);
        this._score++;
        if (type === "grow") this._growPending++;
        else if (type === "shrink") { if (snake.length > 1) snake.pop(); this._growPending = 0; }
        else if (type === "fast") this._speed *= 1.25;
        else if (type === "slow") this._speed *= 0.8;
        spawnEggs(snake, this._eggs);
      }
      this._hudDirty = true;
    }
  }

  // ==== 狀態:遊戲結束 ====
  class DeadState {
    constructor(score, best, snake, eggs) {
      this.RestartEvent = null; // () => void
      this._snake = snake;
      this._eggs = eggs;
      this._stats = `本局分數 ${score}　最高分 ${best}`;
      this._restart = false;
      this._onKey = (ev) => {
        if (ev.key === "Enter") this._restart = true;
      };
    }
    Enable() {
      el.deadStats.textContent = this._stats;
      el.dead.classList.remove("hidden");
      document.addEventListener("keydown", this._onKey);
    }
    Disable() {
      document.removeEventListener("keydown", this._onKey);
      el.dead.classList.add("hidden");
    }
    Update() {
      if (this._restart) return this.RestartEvent();
      drawBoard(this._snake, this._eggs);
    }
  }

  // ==== Owner:持有原料與狀態機,_toXxx 是唯一的轉移表 ====
  class Game {
    constructor() {
      this._machine = new StateMachine();
      this._best = Number(localStorage.getItem("snake.best") || 0);
      this._lastTime = undefined;
    }
    Start() {
      this._toReady();
      requestAnimationFrame((t) => this._loop(t));
    }
    _loop(t) {
      if (this._lastTime === undefined) this._lastTime = t;
      const dt = t - this._lastTime;
      this._lastTime = t;
      this._machine.Update(dt);
      requestAnimationFrame((t2) => this._loop(t2));
    }
    _updateHud(score, len, speed) {
      el.score.textContent = score;
      el.best.textContent = this._best;
      el.len.textContent = len;
      el.spd.textContent = speed.toFixed(2) + "x";
    }
    _toReady() {
      const { snake, eggs } = createBoard();
      const state = new ReadyState(snake, eggs);
      state.StartEvent = (dir) => this._toRunning(snake, eggs, dir);
      this._updateHud(0, snake.length, 1);
      this._machine.Change(state);
    }
    _toRunning(snake, eggs, dir) {
      const state = new RunningState(snake, eggs, dir);
      state.HudEvent = (score, len, speed) => this._updateHud(score, len, speed);
      state.DiedEvent = (score, s, e) => this._toDead(score, s, e);
      this._machine.Change(state);
    }
    _toDead(score, snake, eggs) {
      if (score > this._best) {
        this._best = score;
        localStorage.setItem("snake.best", String(this._best));
      }
      const state = new DeadState(score, this._best, snake, eggs);
      state.RestartEvent = () => this._toReady();
      this._machine.Change(state);
    }
  }

  new Game().Start();
})();
</script>
</body>
</html>
